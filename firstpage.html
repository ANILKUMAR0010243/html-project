  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KL FEEDBACK</title>
    <link rel="stylesheet" type="text/css" href="firstpage.css">
</head>
<body>

  
    <div class="logo">
        <img src="kl university header .jpg" alt="KL University Header" class="header-image">
    </div>

    <h1>Welcome to Student Feedback and Evaluation System</h1>

    <div class="login-sections">
        <div class="login-box">
            <h2>Login</h2>

            <form action="feedback.html" method="post">
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required><br><br>

                <label for="password">Password:</label><br>
                <input type="password" id="password" name="password" required><br><br>

                <button type="submit">Login</button>
            </form>

        </div>
    </div>

</body>
</html>
