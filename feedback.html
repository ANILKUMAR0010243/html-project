<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback Form</title>
    <link rel="stylesheet" href="feedback.css">
    </head>
<body>

    <header>
            <img src="logo.jpeg" alt="KL University Logo" class="logo">
    </header>

    <main>
        <h1>Student Feedback Form</h1>

        <div class="button-row">

            <div class="feedback-column" id="courses-column">
                <button type="button" class="feedback-button">Courses</button>
                <div class="image-space">
                    <img src="courses.jpg" alt="Courses Image" class="feedback-image">
                    </div>
            </div>

            <div class="feedback-column" id="instructors-column">
                <button type="button" class="feedback-button">Instructors</button>
                <div class="image-space">
                    <img src="instructors1.jpg" alt="Instructors Image" class="feedback-image">
                    </div>
            </div>

            <div class="feedback-column" id="services-column">
                <button type="button" class="feedback-button">Institutional Services</button>
                <div class="image-space">
                    <img src="services.jpeg" alt="Services Image" class="feedback-image">
                    </div>
            </div>

        </div> </main>
        <hr>
        <p> *This website is used to get feedback on courses, instructors and institutional services
        </p>
</body>
</html>
